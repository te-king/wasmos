[package]
name = "wasmos"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = ["crates/abi", "crates/kernel", "crates/wlib", "crates/wshell"]

[dependencies]
ovmf-prebuilt = "0.2.9"
tempfile = "3.27"
anyhow = "1"

[build-dependencies]
kernel = { path = "crates/kernel", artifact = "bin", target = "x86_64-unknown-uefi" }
