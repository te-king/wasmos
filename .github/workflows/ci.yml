name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    name: Build and boot in QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Installs the pinned nightly and targets from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # The kernel and the wasm crates only build for their own targets.
      - name: Clippy
        run: |
          cargo clippy --locked -p kernel --target x86_64-unknown-uefi -- -D warnings
          cargo clippy --locked -p wlib -p wshell --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --locked -p wasmos -- -D warnings

      - name: Build
        run: cargo build --locked

      # Fails if the kernel panics, reports failure, or hangs past the
      # runner's timeout.
      - name: Boot kernel
        run: cargo run --locked
