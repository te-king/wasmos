name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    name: Build and boot in QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Installs the pinned nightly and targets from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      # Fails if the kernel panics, reports failure, or hangs past the
      # runner's timeout.
      - name: Boot kernel
        run: cargo run --locked
