[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
# validate: check guest modules before running them.
# auto-dispatch: fall back to loop dispatch in unoptimised builds, where
# tail-call dispatch would grow the kernel stack on every instruction.
wasmi = { version = "2.0.0", default-features = false, features = [
    "validate",
    "auto-dispatch",
] }
uefi = "0.41.0"
talc = "5.1.1"
spin = "0.12.3"
futures-util = { version = "0.3.34", default-features = false }

# x86_64 stuff
x2apic = "0.5.0"
uart_16550 = "0.8.1"
x86_64 = "0.15.5"

# os applications
wshell = { path = "../wshell", artifact = "bin", target = "wasm32-unknown-unknown" }
